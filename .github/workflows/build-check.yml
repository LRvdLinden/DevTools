name: Build check

on:
  push:
    branches: ['**', '!ci-logs']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  xcode:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version | tee xcode-version.txt
      - name: Build iOS app (incl. Watch + widgets), unsigned
        run: |
          set -o pipefail
          xcodebuild -project DevTools.xcodeproj -scheme DevTools \
            -destination 'generic/platform=iOS' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee build.log || echo "BUILD_FAILED" >> build.log
      - name: Check embedded frameworks and runpaths
        if: success()
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path "*Debug-iphoneos/DevTools.app" -maxdepth 6 | head -1)
          {
            echo "[rpath] app: $(otool -l "$APP/DevTools" | grep -A2 LC_RPATH | grep path | awk '{print $2}' | tr '\n' ' ')"
            echo "[rpath] nse: $(otool -l "$APP/PlugIns/OneSignalNotificationServiceExtension.appex/OneSignalNotificationServiceExtension" | grep -A2 LC_RPATH | grep path | awk '{print $2}' | tr '\n' ' ')"
            echo "[frameworks] $(ls "$APP/Frameworks" | tr '\n' ' ')"
          } >> build.log
      - name: Build Mac Catalyst app, unsigned
        if: success()
        run: |
          set -o pipefail
          xcodebuild -project DevTools.xcodeproj -scheme DevTools \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee catalyst.log || echo "CATALYST_FAILED" >> catalyst.log
          grep -E "error:|BUILD SUCCEEDED|BUILD FAILED|CATALYST_FAILED" catalyst.log | sed 's/^/[catalyst] /' >> build.log || true
      - name: Export localizations (string extraction)
        if: success()
        run: |
          xcodebuild -exportLocalizations -project DevTools.xcodeproj -localizationPath loc -exportLanguage en > loc.log 2>&1 || true
          find loc -name "*.xliff" -exec cp {} ./export-en.xliff \; || true
      - name: Publish result to ci-logs branch
        if: always()
        run: |
          SHA=$(git rev-parse --short HEAD)
          mkdir -p /tmp/out && cd /tmp/out
          cp $GITHUB_WORKSPACE/xcode-version.txt . || true
          grep -E "error:|BUILD SUCCEEDED|BUILD FAILED|BUILD_FAILED|\*\* |\[rpath\]|\[frameworks\]" $GITHUB_WORKSPACE/build.log | sort -u | head -400 > summary.txt || true
          tail -150 $GITHUB_WORKSPACE/build.log > tail.txt || true
          cp $GITHUB_WORKSPACE/export-en.xliff . 2>/dev/null || true
          tail -30 $GITHUB_WORKSPACE/loc.log > loc-tail.txt 2>/dev/null || true
          echo "$SHA" > sha.txt
          git init -q && git checkout -q -b ci-logs
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "CI $SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs
