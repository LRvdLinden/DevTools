<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--text:#111318;--sec:#6B6E78;--track:rgba(0,0,0,.07);--accent:#0A6CFF;--cyan:#13B5D9;--live:#1FA851;--review:#F08A00;--pending:#7A5CFA;--red:#E5343A;--chip:rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root{--text:#F2F3F7;--sec:#9A9DA8;--track:rgba(255,255,255,.08);--accent:#2F8BFF;--cyan:#3CD3FF;--live:#34D46A;--review:#FFA733;--pending:#9B85FF;--red:#FF5A5F;--chip:rgba(255,255,255,.07)}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"SF Pro Text",Inter,Roboto,sans-serif;color:var(--text);padding:12px 14px;-webkit-font-smoothing:antialiased;overflow:hidden}
.hdr{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--sec)}
.hdr .sp{flex:1}.hdr .tr{font-variant-numeric:tabular-nums;opacity:.8}
.logo{width:14px;height:14px}
.icon{flex:none;object-fit:cover;background:linear-gradient(135deg,var(--accent),var(--cyan));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;overflow:hidden}
.big{font-size:28px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.1}
.delta{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}.delta.up{color:var(--live)}.delta.down{color:var(--red)}.delta span{color:var(--sec);font-weight:400}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:8px}
.muted{color:var(--sec);font-size:11px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;height:100%;padding:16px 0}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/javascript">

const LOGO = '<svg class="logo" viewBox="0 0 960 960"><path fill="#0484FD" fill-rule="evenodd" d="M230 140H730A110 110 0 0 1 840 250V710A110 110 0 0 1 730 820H230A110 110 0 0 1 120 710V250A110 110 0 0 1 230 140ZM200 300V710A40 40 0 0 0 240 750H720A40 40 0 0 0 760 710V300ZM220 196A26 26 0 1 1 220 248A26 26 0 1 1 220 196ZM300 196A26 26 0 1 1 300 248A26 26 0 1 1 300 196ZM380 196A26 26 0 1 1 380 248A26 26 0 1 1 380 196Z"/><rect x="232" y="340" width="236" height="190" rx="30" fill="#0484FD"/><rect x="492" y="340" width="236" height="190" rx="30" fill="#0484FD"/><rect x="232" y="560" width="236" height="160" rx="30" fill="#0484FD"/><rect x="492" y="560" width="236" height="160" rx="30" fill="#0484FD"/></svg>';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const compact = n => (n == null ? '—' : Intl.NumberFormat(undefined, { notation: 'compact', maximumFractionDigits: 1 }).format(n));
const num = n => (n == null ? '—' : Intl.NumberFormat().format(n));
const signed = n => (n > 0 ? '+' + compact(n) : n < 0 ? '−' + compact(-n) : '±0');
const money = (v, c) => { try { return Intl.NumberFormat(undefined, { style: 'currency', currency: c || 'USD', maximumFractionDigits: 0 }).format(v || 0); } catch (e) { return Math.round(v || 0); } };
function iconHtml(app, size) {
  const r = Math.round(size * 0.225);
  if (app && app.icon) return `<img class="icon" src="${esc(app.icon)}" style="width:${size}px;height:${size}px;border-radius:${r}px">`;
  return `<div class="icon" style="width:${size}px;height:${size}px;border-radius:${r}px;font-size:${size * 0.45}px">${esc(((app && app.name) || '?').slice(0, 1))}</div>`;
}
function deltaHtml(d, suffix) {
  if (d == null) return '';
  const cls = d > 0 ? 'up' : d < 0 ? 'down' : '';
  const arrow = d > 0 ? '↗' : d < 0 ? '↘' : '=';
  return `<span class="delta ${cls}">${arrow} ${signed(d)}${suffix ? ` <span>${suffix}</span>` : ''}</span>`;
}
function delta7(history) {
  if (!history || history.length < 14) return null;
  const s = a => a.reduce((t, p) => t + p.value, 0);
  return s(history.slice(-7)) - s(history.slice(-14, -7));
}
/** Homey Insights-style chart: gradient area, smooth line, dot on last value, min/max labels. */
function insightsChart(points, w, h, color, axis) {
  const data = (points || []).slice(-30);
  if (data.length < 2) return '';
  const vals = data.map(p => p.value);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = Math.max((hi - lo) * 0.15, 1);
  const y0 = lo - pad, y1 = hi + pad;
  const right = axis ? 26 : 2;
  const X = i => 2 + (w - right - 4) * i / (data.length - 1);
  const Y = v => 4 + (h - 8) * (1 - (v - y0) / (y1 - y0));
  let d = `M${X(0)},${Y(vals[0])}`;
  for (let i = 1; i < vals.length; i++) {
    const cx = (X(i - 1) + X(i)) / 2;
    d += ` C${cx},${Y(vals[i - 1])} ${cx},${Y(vals[i])} ${X(i)},${Y(vals[i])}`;
  }
  const area = `${d} L${X(vals.length - 1)},${h} L${X(0)},${h} Z`;
  const id = 'g' + Math.random().toString(36).slice(2);
  let axisSvg = '';
  if (axis) {
    for (const v of [lo, hi]) {
      axisSvg += `<line x1="0" x2="${w - right}" y1="${Y(v)}" y2="${Y(v)}" stroke="currentColor" stroke-opacity=".18" stroke-dasharray="2 3" stroke-width=".6"/>`
        + `<text x="${w - right + 4}" y="${Y(v) + 3}" font-size="8" fill="currentColor" fill-opacity=".55">${compact(v)}</text>`;
    }
  }
  const lx = X(vals.length - 1), ly = Y(vals[vals.length - 1]);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="color:var(--text);overflow:visible">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".45"/><stop offset="1" stop-color="${color}" stop-opacity=".02"/></linearGradient></defs>
    ${axisSvg}<path d="${area}" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"/>
    <circle cx="${lx}" cy="${ly}" r="2.8" fill="${color}"/></svg>`;
}
function sparkline(points, w, h, color) {
  const data = (points || []).slice(-30);
  if (data.length < 2) return '';
  const vals = data.map(p => p.value);
  const lo = Math.min(...vals), hi = Math.max(...vals) || 1;
  const X = i => w * i / (vals.length - 1), Y = v => 2 + (h - 4) * (1 - (v - lo) / Math.max(hi - lo, 1));
  let d = `M${X(0)},${Y(vals[0])}`;
  for (let i = 1; i < vals.length; i++) { const cx = (X(i - 1) + X(i)) / 2; d += ` C${cx},${Y(vals[i - 1])} ${cx},${Y(vals[i])} ${X(i)},${Y(vals[i])}`; }
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.5"/></svg>`;
}
const ACCENT = () => getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#0A6CFF';

function onHomeyReady(Homey) {
  const t = key => Homey.__('widget.' + key);
  const settings = Homey.getSettings() || {};
  const root = document.getElementById('root');
  let first = true;
  async function load() {
    try {
      const data = await Homey.api('GET', '/');
      root.innerHTML = render(data, settings, t);
    } catch (err) {
      root.innerHTML = `<div class="empty">${LOGO.replace('class="logo"', 'style="width:30px;height:30px"')}<div class="muted">${esc(err.message || err)}</div></div>`;
    }
    if (first) { first = false; Homey.ready({ height: Math.max(document.body.scrollHeight, 60) }); }
    else Homey.setHeight(Math.max(document.body.scrollHeight, 60)).catch(() => {});
  }
  Homey.on('update', load);
  setInterval(load, 10 * 60 * 1000);
  load();
}

function render(data, settings, t) {
  if (!data.apps.length) return `<div class="empty">${LOGO.replace('class="logo"', 'style="width:30px;height:30px"')}<div class="muted">${t('no_data')}</div></div>`;
  const count = Number(settings.count) || 5;
  const p = data.portfolio;
  let html = `<div class="hdr">${LOGO}<span>${t('top_apps')}</span><span class="sp"></span><span class="tr">${data.hasSales ? compact(p.last30) + ' · 30d' : data.apps.length + ' apps'}</span></div>`;
  for (const a of data.apps.slice(0, count)) {
    const s = a.stats;
    const sub = a.state === 'READY_FOR_SALE' ? `<span style="color:var(--live)">v${esc(a.live)}</span>` : `<span style="color:${a.color}">${esc(a.label)}</span>`;
    html += `<div class="row" style="margin-top:9px">${iconHtml(a, 30)}
      <div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.name)}
        ${a.inReview ? '<span style="color:var(--review);font-size:10px"> ⌛</span>' : ''}${a.attention ? '<span style="color:var(--pending);font-size:10px"> ●</span>' : ''}</div>
        <div style="font-size:10px;font-weight:600">${sub}${a.rating ? ` <span style="color:#FFD60A">★ ${a.rating.toFixed(1)}</span>` : ''}</div></div>
      ${s ? sparkline(s.history, 56, 22, ACCENT()) : ''}
      <div style="text-align:right;min-width:46px"><div style="font-size:12.5px;font-weight:800">${s ? compact(s.last30) : '—'}</div>${s ? deltaHtml(delta7(s.history)) : ''}</div></div>`;
  }
  return html;
}

</script>
</body>
</html>
